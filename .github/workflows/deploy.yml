name: Deploy app to GitHub Pages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skipped until deploy is configured (repo variables set, Pages enabled).
    if: vars.AUTH_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Public identifiers, set as repository *variables* (not secrets).
          VITE_GITHUB_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.GH_APP_SLUG }}
          VITE_AUTH_URL: ${{ vars.AUTH_URL }}
          VITE_DATA_REPO: ${{ vars.DATA_REPO }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
